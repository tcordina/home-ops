---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: &name backup-daily
spec:
  name: *name
  cron: "0 6 * * *" # every day at 6AM
  task: "backup"
  retain: 14
  concurrency: 1
  groups:
    - backup
  parameters:
    full-backup-interval: "7"
