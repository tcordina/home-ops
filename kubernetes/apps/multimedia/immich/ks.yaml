---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 1h
  prune: true
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app

  path: ./kubernetes/apps/multimedia/immich/app
  components:
    - ../../../../components/cnpg/
    - ../../../../components/volsync/
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 10Gi
      CNPG_DATA_STORAGE_SIZE: 4Gi
      CNPG_CPU_REQUEST: 100m
      CNPG_MEMORY_REQUEST: 128Mi
      CNPG_MEMORY_LIMIT: 1Gi

  dependsOn:
    - name: cnpg
      namespace: flux-system
    - name: cnpg-barman
      namespace: flux-system
    - name: volsync
      namespace: flux-system

  decryption:
    provider: sops