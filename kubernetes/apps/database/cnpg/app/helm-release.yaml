apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: database
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg

  values:
    replicaCount: 1
    affinity: {}
    topologySpreadConstraints: []
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi

    monitoring:
      podMonitorEnabled: true
      grafanaDashboard: { create: false }