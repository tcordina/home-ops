                            "rawQuery": true,
                            "rawSql": "WITH hours AS (\n  SELECT generate_series(0, 23) AS hour\n),\nmessage_counts AS (\n  SELECT\n    EXTRACT(HOUR FROM time)::INTEGER AS hour,\n    guild_id, channel_id, user_name,\n    COUNT(*) AS message_count\n  FROM messages\n  WHERE $__timeFilter(time)\n    AND guild_id = 273436886461054979\n    AND channel_id = 273436886461054979\n  GROUP BY hour, guild_id, channel_id, user_name\n)\nSELECT\n  to_timestamp(h.hour * 3600) AS time,\n  COALESCE(mc.user_name, 'No messages') AS metric,\n  COALESCE(mc.message_count, 0) AS value\nFROM hours h\nLEFT JOIN message_counts mc ON h.hour = mc.hour\nWHERE mc.message_count IS NULL\n   OR mc.message_count > 9\n   OR EXTRACT(EPOCH FROM ($__timeTo()::timestamp - $__timeFrom()::timestamp)) < 31536001  -- 1 year and 1 second in seconds\nORDER BY h.hour",
