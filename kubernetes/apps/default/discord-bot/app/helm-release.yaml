---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: discord-bot
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  interval: 1h
  timeout: 1h
  values:
    controllers:
      bot:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          app:
            image:
              repository: registry.gitlab.com/tcordina/discord-bot
              tag: develop
              # digest: sha256:bd4b2d419a9a7b93bc4c95aff27750341d018e5f80df722ed0e32d3e2eb02f54 # @bot
              pullPolicy: IfNotPresent
            env:
              - name: LOG_LEVEL
                value: "INFO"
              - name: POSTGRES_HOST
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-postgres-app
                    key: host
              - name: POSTGRES_PORT
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-postgres-app
                    key: port
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-postgres-app
                    key: user
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-postgres-app
                    key: password
              - name: POSTGRES_DB
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-postgres-app
                    key: dbname
            envFrom:
              - secretRef:
                  name: discord-bot-secrets
              - secretRef:
                  name: default-auth-backblaze
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/main", "--health"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
