---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
spec:
  interval: 1h
  timeout: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    controllers:
      netbird:
        containers:
          app:
            image:
              repository: netbirdio/netbird
              tag: 0.83.2-rootless@sha256:23acf9191db22ba009e336496806381fa2311649609982d72cb722e5e97c3a43
            env:
              NB_HOSTNAME: cluster
              NB_LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: netbird-secret
            resources:
              requests:
                cpu: 500m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN
                  - NET_RAW
                  - SYS_ADMIN
                  - SYS_RESOURCE

    persistence:
      config:
        existingClaim: ${APP}
        advancedMounts:
          netbird:
            app:
              - path: /var/lib/netbird
                subPath: netbird
              - path: /root
                subPath: root
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        advancedMounts:
          netbird:
            app:
              - path: /dev/net/tun
      runtime:
        type: emptyDir
        advancedMounts:
          netbird:
            app:
              - path: /var/log
                subPath: var/log
              - path: /var/run
                subPath: var/run