---
# doco-cd itself. This file lives on the host (e.g. /opt/doco-cd/), NOT in
# the app repo — the controller cannot GitOps itself.
#
# Poll-only setup: no published ports, webhook/API endpoints stay disabled
# (their secrets are unset), the host firewall stays closed.
secrets:
  # api_secret:
  #   file: /var/www/doco-cd/auth/api_secret.env
  bw_token:
    file: /var/www/doco-cd/auth/bw_token.env
  git_token:
    file: /var/www/doco-cd/auth/git_token.env

services:
  app:
    # renovate: datasource=docker depName=ghcr.io/kimdre/doco-cd
    image: ghcr.io/kimdre/doco-cd:0.114.0
    container_name: doco-cd
    restart: unless-stopped
    environment:
      # API_SECRET_FILE: /run/secrets/api_secret
      DEPLOY_CONFIG_BASE_DIR: ./docker/vps/
      GIT_ACCESS_TOKEN_FILE: /run/secrets/git_token
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://gitlab.com/tcordina/home-ops.git
          reference: refs/heads/main
          interval: 120
      SECRET_PROVIDER: bitwarden_sm
      SECRET_PROVIDER_API_URL: "https://vault.bitwarden.com/api"
      SECRET_PROVIDER_IDENTITY_URL: "https://vault.bitwarden.com/identity"
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/bw_token
      TZ: Europe/Paris
    # ports:
    #   - "8080:80"
    #   - "9120:9120"
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
    secrets:
      # - api_secret
      - bw_token
      - git_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

volumes:
  data: {}

networks:
  default:
    name: edge
    external: true
